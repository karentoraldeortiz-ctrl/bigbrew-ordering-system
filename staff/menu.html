<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Big Brew Maysan - Big in Taste, Bit in Price.">
    <meta name="keywords" content="Staff Panel">
    <meta name="author" content="Allyana Flores, Karen Ortiz">
    <title>Menu | Staff</title>
    <link rel="shortcut icon" href="../assets/logo/logo-black.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="staff.css">

</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <img src="../assets/logo/bbmaysan.png" alt="">
        </div>
        <hr>
        <div class="main-menu">
            <h6>MAIN MENU</h6>
            <div class="dash-tab">
                <a href="dashboard.html"><h3><i class="fa fa-dashboard"></i> Dashboard</h3></a>
            </div>
            <div class="orders-tab">
                <a href="orders.html"><h3><i class="fa fa-shopping-cart"></i> Orders</h3></a>
            </div>
            <div class="menu-tab active">
                <a href="#"><h3><i class="fa fa-bars"></i> Menu Availability</h3></a>
            </div>
        </div>
        <hr>
        <div class="acc">
            <h6>ACCOUNT</h6>
            <button class="logout">
                <h3><i class="fa fa-sign-out"></i> Logout</h3>
            </button>
        </div>
        <hr>
        <div class="staff-acc">
            <i class="fa fa-user"></i>
                <div>
                    <h5>Staff User</h5>
                    <p>maysan.staff@bigbrew.com</p>
                </div>
        </div>
    </aside>
    <main class="menu-main-content">
        <header>
            <h2>Menu Availability</h2>
            <p>Update availability of today's product!</p>
        </header>
            <div class="menu-filter">
                <div class="menu-search">
                <div>
                    <span><i class="fa fa-search"></i></span>
                <input type="text"> 
                </div>
            </div>
            <div class="sort-menu">
                <label for="">Sort:</label>
                <select name="" id="">
                    <option value="available">Available</option>
                    <option value="not-available">Not Available</option>
                </select>
            </div>
            </div>

        <section class="menu-content">
            <div class="menu-category">
                <div>All</div>
                <div>Frap</div>
                <div>Brosty</div>
                <div>Special</div>
            </div>
            <div class="menu-table">
                <table>
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Dark Choco</td>
                            <td>Available</td>
                        </tr>
                        <tr>
                            <td>Dark Choco</td>
                            <td>Available</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
